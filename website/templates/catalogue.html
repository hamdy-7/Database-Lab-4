{% extends 'base.html' %}
{% block content %}
<div class="glass-card p-4">
    <h3 class="fw-bold mb-4 text-info"><i class="bi bi-journals me-2"></i>Complete Library Catalogue</h3>
    <div class="table-responsive">
        <table class="table table-dark-custom align-middle">
            <thead>
                <tr>
                    <th>#ID</th>
                    <th>Book Title</th>
                    <th>Author</th>
                    <th>Publisher</th>
                    <th>Category</th>
                    <th>Price</th>
                </tr>
            </thead>
            <tbody>
                {% for b in books %}
                <tr>
                    <td>#{{ b.book_id }}</td>
                    <td class="fw-semibold text-light">{{ b.title }}</td>
                    <td class="text-info">{{ b.author_name }}</td>
                    <td class="text-warning">{{ b.publisher_name }}</td>
                    <td><span class="badge bg-primary">{{ b.category_name }}</span></td>
                    <td class="text-success fw-bold">${{ "%.2f"|format(b.price) }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
