<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grand Library Intelligence Hub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --accent-blue: #38bdf8;
            --accent-purple: #c084fc;
        }
        body {
            background: radial-gradient(circle at top left, #1e1b4b, #0f172a, #020617);
            color: #f8fafc;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
        }
        .navbar-custom {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }
        .table-dark-custom {
            --bs-table-bg: transparent;
            --bs-table-color: #cbd5e1;
            border-color: rgba(255, 255, 255, 0.08);
        }
        .badge-gradient {
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            color: #000;
            font-weight: 600;
        }
        .btn-glow {
            background: linear-gradient(135deg, #0284c7, #6366f1);
            border: none;
            color: white;
            box-shadow: 0 4px 15px rgba(2, 132, 199, 0.4);
            transition: all 0.3s;
        }
        .btn-glow:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(2, 132, 199, 0.6);
            color: white;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom sticky-top py-3">
        <div class="container">
            <a class="navbar-brand fw-bold text-transparent bg-clip-text bg-gradient fs-4" href="#">
                <i class="bi bi-book-half text-info me-2"></i>Library Core
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto gap-2">
                    <li class="nav-item"><a class="nav-link px-3" href="/search"><i class="bi bi-search me-1"></i>Search (F2.1)</a></li>
                    <li class="nav-item"><a class="nav-link px-3" href="/catalogue"><i class="bi bi-journal-bookmark me-1"></i>Catalogue (F2.2)</a></li>
                    <li class="nav-item"><a class="nav-link px-3" href="/reports"><i class="bi bi-bar-chart-line me-1"></i>Reports (F2.3)</a></li>
                    <li class="nav-item"><a class="nav-link px-3" href="/loans"><i class="bi bi-person-lines-fill me-1"></i>Loans (F2.4)</a></li>
                    <li class="nav-item"><a class="nav-link px-3" href="/most-borrowed"><i class="bi bi-fire me-1"></i>Top Stats (F2.5)</a></li>
                    <li class="nav-item"><a class="nav-link px-3" href="/authors-books"><i class="bi bi-people me-1"></i>Authors (F2.6)</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container py-5">
        {% block content %}{% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
